# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: hendisantika/spring-boot-k8s-argocd

jobs:
  build:

    runs-on: ubuntu-latest

    # The dependency submission step below POSTs a snapshot, which needs write
    # access. The repository default is read-only, so request it explicitly.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8

  # Builds and pushes the image tagged with the workflow run number, then writes that
  # same tag back into k8s/spring-app-deployment.yaml so Argo CD picks up the new revision.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Log in to Docker Hub
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      run: |
        docker build -t "$IMAGE_NAME:${{ github.run_number }}" .
        docker push "$IMAGE_NAME:${{ github.run_number }}"

    - name: Bump image tag in the Argo CD manifest
      run: |
        sed -i -E "s|(image: ${IMAGE_NAME}):.*|\1:${{ github.run_number }}|" k8s/spring-app-deployment.yaml
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add k8s/spring-app-deployment.yaml
        git diff --cached --quiet && echo "No manifest change" && exit 0
        git commit -m "ci: bump image to ${IMAGE_NAME}:${{ github.run_number }} [skip ci]"
        git push
